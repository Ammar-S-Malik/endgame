[package]
name = "endgame"
version = "0.1.0"
edition = "2021"
description = "Endgame: a UCI chess engine written from scratch in Rust"

[lib]
name = "endgame"
path = "src/lib.rs"

[[bin]]
name = "endgame"
path = "src/main.rs"

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = false
